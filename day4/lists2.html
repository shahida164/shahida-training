<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Description lists</title>
</head>
<body>
  <dl>
    <dt>paper</dt>
    <dd>great for pencil drawing</dd>
    <dt>pencils</dt>
    <dd>can write or draw on the papers</dd>
  </dl>
  <dl>
    <dt>HTML</dt>
    <dd>Hyper text markup language,the standard language for creating webpages.</dd>
    <dt>CSS</dt>
    <dd>cascading styling sheets,used for styling the look and formatting of a webpage.</dd>
  </dl>
  <dl>
    <dt>cofee</dt>
    <dd>black hot coffee</dd>
    <dt>tea</dt>
    <dd>green lemon tea</dd>
  </dl>
</body>
</html>
